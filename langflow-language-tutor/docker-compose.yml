services:
  langflow:
    image: docker.io/langflowai/langflow:latest
    pull_policy: missing
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LANGFLOW_DATABASE_URL: postgresql://langflow:langflow@postgres:5432/langflow
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_COMPONENTS_PATH: /app/custom_components
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-langflow}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:-langflow-tutor-2026}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: langflow
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
    volumes:
      - langflow-data:/app/langflow
      - ./custom_components:/app/custom_components:ro
      - ./data:/app/data:ro
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16-trixie
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    ports:
      - "5434:5432"
    volumes:
      - langflow-postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-words.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow -d langflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  langflow-postgres:
  langflow-data:
